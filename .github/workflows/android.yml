name: APK Android

# Compila el APK en cada cambio de la app y lo publica en Releases
# (https://github.com/viferor/visor-pendientes-3d/releases/latest).
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'lib/**'
      - 'icons/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # El runner ya trae el SDK de Android; solo se asegura la plataforma 36
      - name: SDK de Android 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la web al proyecto Android
        run: npm run android:sync

      - name: Versión
        id: ver
        run: |
          NAME="$(node -p "require('./package.json').version").${{ github.run_number }}"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }} 2>&1 | tee ../gradle.log
          cp app/build/outputs/apk/release/app-release.apk "../Pendientes3D-${{ steps.ver.outputs.name }}.apk"

      - name: Mostrar el error de compilación
        if: failure()
        run: |
          grep -n -A8 -E "What went wrong|^e: |error:" gradle.log | head -60 > err.txt || true
          [ -s err.txt ] || tail -40 gradle.log > err.txt
          echo "::error title=Gradle::$(sed -e 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Pendientes3D-${{ steps.ver.outputs.name }}
          path: Pendientes3D-*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Pendientes 3D ${{ steps.ver.outputs.name }}
          body: |
            APK para instalar en Android (7.0 o superior).
            Descarga el archivo .apk desde el móvil y ábrelo. Si es la primera vez, Android pedirá permiso para instalar apps de esta fuente.
            Commit: ${{ github.sha }}
          files: Pendientes3D-*.apk
          make_latest: true
