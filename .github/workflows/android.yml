name: Comprobar Android

# Comprueba que el proyecto Android compila en cada cambio.
# No publica nada: el APK firmado se genera en local con scripts/compilar-apk.bat,
# porque la clave de firma solo existe en el ordenador del autor.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'lib/**'
      - 'icons/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # El runner ya trae el SDK de Android; solo se asegura la plataforma 36
      - name: SDK de Android 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la web al proyecto Android
        run: npm run android:sync

      - name: Versión
        id: ver
        run: |
          NAME="$(node -p "require('./package.json').version").${{ github.run_number }}"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }} 2>&1 | tee ../gradle.log
          ls -la app/build/outputs/apk/release/

      - name: Mostrar el error de compilación
        if: failure()
        run: |
          grep -n -A8 -E "What went wrong|^e: |error:" gradle.log | head -60 > err.txt || true
          [ -s err.txt ] || tail -40 gradle.log > err.txt
          echo "::error title=Gradle::$(sed -e 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')"

